name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gtauto:
    name: gt-auto 全链路验收（沪+深）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 被测系统与工具链仓检出于工作区内（e2e 步骤经 env 指给脚本）。
      # 四仓均为私有仓库，XC_READ_TOKEN 为对各仓只读的 fine-grained PAT。
      - uses: actions/checkout@v4
        with:
          repository: xinchentechnote/fcounter
          path: fcounter
          token: ${{ secrets.XC_READ_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: xinchentechnote/fbsdk
          path: fbsdk
          token: ${{ secrets.XC_READ_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: xinchentechnote/gt-auto
          path: gt-auto
          token: ${{ secrets.XC_READ_TOKEN }}

      # fcounter 构建的 git tag 依赖（私有，匿名拉取 404）：凭证经 insteadOf 注入，
      # 配套 fcounter .cargo/config.toml 的 git-fetch-with-cli，两者缺一即 404。
      # 注意默认构建（不内嵌引擎）也需 omni-rt-engine 凭证：提交的 Cargo.lock 为
      # risk-engine 形态生成（counter-app 条目含 counter-risk-adapter → rt-core），
      # 冷 ~/.cargo/git/db 下 cargo 按 resolve 全量 fetch，缺 omni 凭证即在构建前失败。
      - name: 配置私有仓库拉取凭证
        run: |
          git config --global url."https://x-access-token:${{ secrets.XC_READ_TOKEN }}@github.com/xinchentechnote/fcp.git".insteadOf "https://github.com/xinchentechnote/fcp.git"
          git config --global url."https://x-access-token:${{ secrets.XC_READ_TOKEN }}@github.com/xinchentechnote/fbsdk.git".insteadOf "https://github.com/xinchentechnote/fbsdk.git"
          git config --global url."https://x-access-token:${{ secrets.XC_READ_TOKEN }}@github.com/xinchentechnote/omni-rt-engine.git".insteadOf "https://github.com/xinchentechnote/omni-rt-engine.git"

      - uses: dtolnay/rust-toolchain@1.92
      - uses: actions/setup-go@v5
        with:
          go-version-file: gt-auto/go.mod
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            fcounter
            fbsdk

      - name: gt-auto 全链路验收（沪 + 深）
        env:
          E2E_KEEP: '1'
          # 同级仓检出于工作区内（$GITHUB_WORKSPACE/<repo>），而脚本默认在
          # 检出目录外一级（../<repo>）找同级仓——此处显式指给脚本
          FCOUNTER_DIR: fcounter
          FBSDK_DIR: fbsdk
          GT_AUTO_DIR: gt-auto
        run: ./scripts/e2e_gt_auto.sh

      - name: 上传柜台日志与验收报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gtauto-logs
          path: /tmp/fcounter-gtauto.*/
          if-no-files-found: ignore
